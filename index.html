<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ivneet · Strength</title>
<meta name="theme-color" content="#161510" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #161510;
    --bg-soft: #1c1a14;
    --surface: #211f18;
    --surface-raised: #292619;
    --border: #3a3626;
    --border-soft: #2c2a1e;
    --chalk: #efe9d8;
    --chalk-dim: #9c977f;
    --chalk-faint: #66614e;
    --accent: #e2571f;
    --accent-dim: #7a3820;
    --gold: #c9a03e;
    --green: #7e9c5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    color: var(--chalk);
    font-family: -apple-system, "Segoe UI", sans-serif;
    background-image: radial-gradient(ellipse at top, rgba(226,87,31,0.07), transparent 55%);
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .disp {
    font-family: "Arial Black", -apple-system, "Segoe UI", sans-serif;
    font-weight: 900;
    letter-spacing: -0.01em;
    text-transform: uppercase;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px 48px; }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .title { font-size: 20px; color: var(--chalk); line-height: 1; }
  .title .dot { color: var(--accent); }
  .subtitle { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--chalk-faint); margin-top: 4px; letter-spacing: 0.03em; }
  .unit-btn {
    font-family: ui-monospace, monospace; background: var(--surface); border: 1px solid var(--border);
    color: var(--chalk-dim); font-size: 12px; border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }

  .banner {
    font-family: ui-monospace, monospace; font-size: 12px; padding: 9px 12px; border-radius: 7px;
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--chalk-faint);
  }
  .banner.ok { background: rgba(126,156,90,0.12); border-color: #4a5c38; color: var(--green); }
  .banner.fail { background: rgba(226,87,31,0.14); border-color: var(--accent); color: var(--accent); }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--surface); border-radius: 8px; padding: 3px; border: 1px solid var(--border); }
  .tab-btn {
    flex: 1; font-family: "Arial Black", sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em;
    font-size: 12.5px; padding: 8px 0; border-radius: 6px; border: none; cursor: pointer; background: transparent; color: var(--chalk-dim);
  }
  .tab-btn.active { background: var(--accent); color: var(--bg); }

  .field-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .field { flex: 1; }
  .field label { display: block; font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--chalk-faint); letter-spacing: 0.05em; margin-bottom: 6px; }
  .field select, .field input[type="date"] {
    width: 100%; font-family: ui-monospace, monospace; background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 6px; color: var(--chalk); font-size: 14px; padding: 9px 10px; outline: none;
  }

  .status-line { min-height: 20px; margin-bottom: 10px; font-family: ui-monospace, monospace; font-size: 11.5px; }
  .status-line.saving { color: var(--chalk-faint); }
  .status-line.saved { color: var(--green); }
  .status-line.error button {
    font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--bg); background: var(--accent);
    border: none; border-radius: 5px; padding: 4px 10px; cursor: pointer;
  }

  .day-title { font-size: 19px; line-height: 1.1; }
  .day-focus { font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--accent); margin-top: 3px; }
  .progress-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; }
  .progress-track { flex: 1; height: 6px; background: var(--border-soft); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .25s ease; }
  .progress-count { font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--chalk-faint); white-space: nowrap; }

  .cue-box {
    font-family: ui-monospace, monospace; font-size: 12px; color: var(--chalk-faint); line-height: 1.6;
    background: var(--bg-soft); border: 1px solid var(--border-soft); border-radius: 6px; padding: 10px 12px; margin: 10px 0 16px;
  }

  .exercise-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 6px; margin-bottom: 12px; }
  .exercise-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .exercise-name { font-size: 15.5px; color: var(--chalk); line-height: 1.15; }
  .exercise-target { font-family: ui-monospace, monospace; font-size: 12px; color: var(--gold); margin-top: 4px; letter-spacing: 0.02em; }
  .video-link {
    color: var(--chalk-dim); display: flex; align-items: center; gap: 4px; font-size: 11px; font-family: ui-monospace, monospace;
    text-decoration: none; border: 1px solid var(--border); border-radius: 5px; padding: 4px 7px; white-space: nowrap;
  }

  .set-row { display: grid; grid-template-columns: 26px 1fr 1fr 34px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border-soft); }
  .set-idx { font-family: ui-monospace, monospace; color: var(--chalk-faint); font-size: 13px; }
  .set-row input[type="number"] {
    width: 100%; font-family: ui-monospace, monospace; background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 4px; color: var(--chalk); font-size: 14px; padding: 6px 8px; outline: none;
  }
  .bw-label { font-family: ui-monospace, monospace; color: var(--chalk-faint); font-size: 12.5px; }
  .chalk-check { background: none; border: none; padding: 0; cursor: pointer; justify-self: center; }

  .set-progress { display: flex; gap: 3px; margin: 10px 0 12px; }
  .set-progress > div { flex: 1; height: 3px; border-radius: 2px; background: var(--border-soft); }
  .set-progress > div.done { background: var(--accent); }

  .rest-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 34px 18px; text-align: center; }

  .section { border-bottom: 1px solid var(--border-soft); }
  .section-btn {
    width: 100%; background: none; border: none; padding: 14px 2px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
  }
  .section-btn .left { display: flex; align-items: center; gap: 9px; }
  .section-title { font-size: 14.5px; color: var(--chalk); }
  .section-body { padding-bottom: 16px; color: var(--chalk-dim); font-size: 13.5px; line-height: 1.6; }
  .section-body p { margin: 6px 0; }
  .section-body b { color: var(--chalk); }
  .chev { transition: transform .15s; color: var(--chalk-faint); }
  .chev.open { transform: rotate(180deg); }

  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .pill {
    font-family: ui-monospace, monospace; font-size: 11.5px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--chalk-dim); cursor: pointer;
  }
  .pill.active { border-color: var(--accent); background: var(--accent-dim); color: var(--chalk); }

  .session-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .session-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .session-date { font-size: 14.5px; color: var(--chalk); }
  .session-count { font-family: ui-monospace, monospace; font-size: 11px; color: var(--chalk-faint); }
  .session-ex-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; color: var(--chalk-dim); }
  .session-ex-row span:last-child { font-family: ui-monospace, monospace; color: var(--gold); }

  .empty-note { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 28px 18px; text-align: center; color: var(--chalk-dim); font-family: ui-monospace, monospace; font-size: 12.5px; }
  .loading-note { color: var(--chalk-faint); font-family: ui-monospace, monospace; font-size: 12px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="disp title">Ivneet<span class="dot">.</span> Strength</div>
      <div class="subtitle" id="todayLabel"></div>
    </div>
    <div style="display:flex;gap:6px;align-items:flex-start">
      <button class="unit-btn" id="backupBtn" title="Download a backup of everything logged">⬇</button>
      <button class="unit-btn" id="unitBtn">LB</button>
    </div>
  </div>
  <div id="backupStatus" class="status-line" style="margin:-4px 0 8px;text-align:right"></div>

  <div class="banner" id="banner">Connecting…</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="train">Train</button>
    <button class="tab-btn" data-tab="progress">Progress</button>
    <button class="tab-btn" data-tab="notes">Notes</button>
    <button class="tab-btn" data-tab="guide">Guide</button>
  </div>

  <div id="trainTab"></div>
  <div id="progressTab" style="display:none"></div>
  <div id="notesTab" style="display:none"></div>
  <div id="guideTab" style="display:none"></div>
</div>

<script>
/* ============================================================
   CONFIG — paste your own Supabase project values here.
   Get these from: Supabase dashboard → Project Settings → API
   ============================================================ */
const SUPABASE_URL = "https://tqpwhnauxamcpdimzzil.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxcHdobmF1eGFtY3BkaW16emlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MjU2MDQsImV4cCI6MjEwMzEwMTYwNH0.ItwK3puKpT-uDvirKRQ4V3A4SFI0VMcboxsPVsHd8uw";

const sb = (SUPABASE_URL.startsWith("http"))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* ============================================================
   PROGRAM DATA
   ============================================================ */
const yt = (q) => `https://www.youtube.com/results?search_query=${encodeURIComponent(q + " proper form tutorial")}`;

// Day metadata is still static — titles, focus, and coaching cues rarely
// change. Exercises themselves are now loaded from the database (the
// `exercises` table) so they can be added/edited from the app.
const WORKOUT_META = [
  {
    id: "day1", label: "Day 1 · Lower (Quads+Glutes)",
    title: "Day 1 — Lower Body", focus: "Quads + Glutes",
    cue: "Control the descent and maintain stable foot pressure. Use the deepest comfortable range you can control. Keep hips and back supported on leg press. Control both directions on leg extension. Take controlled steps on lunges. Full comfortable range on calf raises — pause at the top, lower slowly.",
  },
  {
    id: "day2", label: "Day 2 · Upper (Pull-Up+Back)",
    title: "Day 2 — Upper Body", focus: "Pull-Up Strength + Back",
    cue: "Do the pull-up work first while fresh. Keep shoulders active. Elbows straight on scapular pull-ups. Use only enough assistance for clean reps. Drive elbows down on lat pulldown. Keep chest supported on rows. Tall posture, strong grip, braced trunk on carries.",
  },
  {
    id: "day3", label: "Day 3 · Lower (Glutes+Hamstrings)",
    title: "Day 3 — Lower Body", focus: "Glutes + Hamstrings",
    cue: "Reach full hip extension without hyperextending the lower back. Push hips backward on RDLs and keep the weight close to your legs. Control the step backward on reverse lunges. Avoid excess lower-back movement on kickbacks. Control the return on abduction.",
  },
  {
    id: "day4", label: "Day 4 · Upper (Push-Up+Upper)",
    title: "Day 4 — Upper Body", focus: "Push-Up Strength + Upper Body",
    cue: "Skill work comes first. Choose an elevation that allows clean reps. Lower eccentrics for about 3–5 seconds. Use a neutral grip if it's more comfortable for the shoulder. Keep the load controlled through a comfortable shoulder range.",
  },
  {
    id: "day5", label: "Day 5 · Lower (Unilateral+Glutes)",
    title: "Day 5 — Lower Body", focus: "Glutes + Unilateral Strength",
    cue: "One of the best technical days. Control both the step up and the descent. Prioritize balance and hip control over heavy weight. Resist rotation and keep the trunk stable on Pallof press.",
  },
  {
    id: "day6", label: "Day 6 · Performance",
    title: "Day 6 — Performance + Core", focus: "Pull-Up + Push-Up Practice + Conditioning",
    cue: "Keep this day lighter — slightly more assistance than Day 2. Choose the variation that allows clean technique. Finish with 15–20 min easy-to-moderate cardio — it should not feel like another hard workout.",
  },
];

let WORKOUTS = WORKOUT_META.map(m => ({ ...m, exercises: [] })); // filled in by loadExercises() at startup
const workoutById = (id) => WORKOUTS.find(w => w.id === id);

let exercisesLoadFailed = false; // true if the exercise catalog table is missing/unreachable — must be loud, not silent

async function loadExercises() {
  if (!sb) return;
  const { data, error } = await sb.from("exercises").select("*").order("workout_id").order("sort_order");
  if (error) {
    console.error("failed to load exercise catalog:", error);
    exercisesLoadFailed = true;
    return;
  }
  if (!data || !data.length) {
    // table exists but is empty — almost certainly means the one-time
    // migration SQL hasn't been run yet, not that exercises were deleted
    exercisesLoadFailed = true;
    return;
  }
  exercisesLoadFailed = false;
  const byWorkout = {};
  data.forEach(row => {
    (byWorkout[row.workout_id] = byWorkout[row.workout_id] || []).push({
      id: row.id,
      name: row.name,
      sets: row.sets,
      reps: row.reps,
      rir: row.rir || "—",
      weight: !!row.uses_weight,
      weightLabel: row.weight_label || undefined,
      unit: row.unit === "sec" ? "sec" : undefined,
      video: yt(row.video_query || row.name),
    });
  });
  WORKOUTS = WORKOUT_META.map(m => ({ ...m, exercises: byWorkout[m.id] || [] }));
}

/* ============================================================
   EXERCISE CATALOG MANAGEMENT — add/edit/delete, shared by anyone
   using the app (there's no login separating accounts). Deleting or
   renaming a catalog exercise never touches historical logged rows —
   those are stored as plain text snapshots, independent of the catalog.
   ============================================================ */
function toggleManageExercises() {
  managingExercises = !managingExercises;
  editingCatalogId = null;
  catalogError = "";
  renderTrain();
}

function openAddExercise() {
  editingCatalogId = "new";
  catalogForm = { name: "", sets: 3, reps: "8-12", rir: "—", weight: true, weightLabel: "", unit: "reps" };
  catalogError = "";
  renderTrain();
}

function openEditExercise(ex) {
  editingCatalogId = ex.id;
  catalogForm = {
    name: ex.name, sets: ex.sets, reps: ex.reps, rir: ex.rir,
    weight: ex.weight, weightLabel: ex.weightLabel || "", unit: ex.unit || "reps",
  };
  catalogError = "";
  renderTrain();
}

function cancelCatalogEdit() {
  editingCatalogId = null;
  catalogError = "";
  renderTrain();
}

function readCatalogFormFromDOM() {
  const val = (id) => (document.getElementById(id)?.value || "").trim();
  return {
    name: val("catName"),
    sets: Math.max(1, parseInt(val("catSets"), 10) || 1),
    reps: val("catReps") || "8-12",
    rir: val("catRir") || "—",
    weight: !!document.getElementById("catWeight")?.checked,
    weightLabel: val("catWeightLabel"),
    unit: document.getElementById("catUnit")?.value || "reps",
  };
}

let catalogSaving = false; // prevents a rapid double-tap from firing two concurrent inserts/updates

async function saveCatalogEdit(workoutId) {
  if (!sb || catalogSaving) return;
  const form = readCatalogFormFromDOM();
  catalogError = "";
  if (!form.name) { catalogError = "Exercise needs a name."; renderTrain(); return; }
  catalogSaving = true;
  const payload = {
    workout_id: workoutId,
    name: form.name,
    sets: form.sets,
    reps: form.reps,
    rir: form.rir,
    uses_weight: form.weight,
    weight_label: form.weightLabel || null,
    unit: form.unit,
  };
  let error;
  try {
    if (editingCatalogId === "new") {
      const w = workoutById(workoutId);
      payload.sort_order = w.exercises.length;
      ({ error } = await sb.from("exercises").insert(payload));
    } else {
      ({ error } = await sb.from("exercises").update(payload).eq("id", editingCatalogId));
    }
  } catch (e) {
    error = e;
  } finally {
    catalogSaving = false;
  }
  if (error) { catalogError = "Couldn't save: " + (error.message || "network error — check your connection"); renderTrain(); return; }
  editingCatalogId = null;
  await loadExercises();
  await loadSession(currentDate, currentWorkoutId);
  renderTrain();
}

async function deleteCatalogExercise(id) {
  if (confirmDeleteId !== id) {
    confirmDeleteId = id;
    renderTrain();
    setTimeout(() => { if (confirmDeleteId === id) { confirmDeleteId = null; renderTrain(); } }, 3000);
    return;
  }
  confirmDeleteId = null;
  if (!sb) return;
  catalogError = "";
  let error;
  try {
    ({ error } = await sb.from("exercises").delete().eq("id", id));
  } catch (e) {
    error = e;
  }
  if (error) { catalogError = "Couldn't delete: " + (error.message || "network error — check your connection"); renderTrain(); return; }
  await loadExercises();
  await loadSession(currentDate, currentWorkoutId);
  renderTrain();
}
function allExerciseNames() {
  return [...new Set(WORKOUTS.flatMap(w => w.exercises.map(e => e.name)))].sort();
}

/* ============================================================
   STATE
   ============================================================ */
function localDateStr(d) {
  // Local calendar date as YYYY-MM-DD — deliberately NOT using .toISOString(),
  // which converts to UTC and can silently shift to the next (or previous)
  // day for anyone logging in the evening in a negative-UTC-offset timezone
  // like US Eastern. This is what "today" should mean everywhere in the app.
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

let unit = localStorage.getItem("ivneet_unit_pref") || "lb"; // unit label only, not data — safe to keep local
let currentDate = localDateStr(new Date());
let currentWorkoutId = "day1";
let currentLog = {}; // { "exIdx-setIdx": {weight, reps, done, rowId, perSide, notes, targetReps} }
let exercisePerSide = {}; // { exIdx: boolean } — total vs per-side weight, per exercise
let extraSets = {}; // { exIdx: number } — sets logged beyond the program's planned count
let exerciseNotes = {}; // { exIdx: string } — this-session note per exercise
let targetOverride = {}; // { exIdx: string } — one-time reps override for this session
let saveTimer = null;
let noteSaveTimer = null;
let progressWorkoutId = "day1";
let progressView = "week"; // "week" | "trend" | a WORKOUTS id | "cardio"
let cardioEntry = { minutes: "", done: false, notes: "", rowId: null };
let cardioSaveTimer = null;
let weekOffset = 0; // 0 = this week, -1 = last week, etc. (for the Week progress view)
let trendExercise = null; // set once the exercise catalog loads
let managingExercises = false; // whether the "manage exercises" panel is open for the current workout
let editingCatalogId = null; // db id of the exercise row being edited, or "new" for the add-form
let catalogForm = {}; // working values for the open add/edit form
let confirmDeleteId = null; // two-step delete confirmation (avoids native confirm() dialogs)
let catalogError = ""; // inline error text for the manage-exercises panel (avoids alert() — same iOS PWA risk as prompt())

function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

/* ============================================================
   CHALK CHECK SVG
   ============================================================ */
function chalkCheckSVG(done) {
  return `<svg width="22" height="22" viewBox="0 0 24 24">
    <rect x="1.5" y="1.5" width="21" height="21" rx="3" fill="${done ? 'var(--accent)' : 'transparent'}" stroke="${done ? 'var(--accent)' : 'var(--chalk-faint)'}" stroke-width="1.6"/>
    ${done ? `<path d="M5.5 12.2 L10 16.5 L18.5 6.8" fill="none" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
  </svg>`;
}

/* ============================================================
   CONNECTIVITY CHECK
   ============================================================ */
async function checkConnection() {
  const banner = document.getElementById("banner");
  if (!sb) {
    banner.className = "banner fail";
    banner.textContent = "⚠ Not configured — paste your Supabase URL & key into index.html (see SETUP.md).";
    return false;
  }
  try {
    const { error } = await sb.from("logs").select("id").limit(1);
    if (error) throw error;
    banner.className = "banner ok";
    banner.textContent = "✓ Connected — entries save automatically";
    return true;
  } catch (e) {
    banner.className = "banner fail";
    banner.textContent = "⚠ Storage error: " + (e.message || "could not reach database");
    return false;
  }
}

/* ============================================================
   TRAIN TAB
   ============================================================ */
async function loadSession(dateStr, workoutId) {
  currentLog = {};
  exercisePerSide = {};
  extraSets = {};
  exerciseNotes = {};
  targetOverride = {};
  if (!sb) return;
  let data, error;
  try {
    ({ data, error } = await sb.from("logs")
      .select("*")
      .eq("date", dateStr)
      .eq("workout", workoutId)
      .order("set_number"));
  } catch (e) {
    error = e;
  }
  if (error) { console.error(error); return; }
  const w = workoutById(workoutId);
  const maxSetSeen = {};
  (data || []).forEach(row => {
    const exIdx = w.exercises.findIndex(e => e.name === row.exercise);
    if (exIdx === -1) return;
    currentLog[`${exIdx}-${row.set_number - 1}`] = {
      weight: row.weight ?? "", reps: row.actual_reps ?? "", done: !!row.done,
      rowId: row.id, perSide: !!row.weight_per_side
    };
    if (row.weight_per_side) exercisePerSide[exIdx] = true;
    maxSetSeen[exIdx] = Math.max(maxSetSeen[exIdx] || 0, row.set_number);
    if (row.set_number === 1 && row.notes) exerciseNotes[exIdx] = row.notes;
    if (row.set_number === 1 && row.target_reps && row.target_reps !== w.exercises[exIdx].reps) targetOverride[exIdx] = row.target_reps;
  });
  w.exercises.forEach((ex, ei) => {
    const seen = maxSetSeen[ei] || 0;
    if (seen > ex.sets) extraSets[ei] = seen - ex.sets;
  });
  await loadCardio(dateStr);
}

function effectiveReps(exIdx, ex) {
  return targetOverride[exIdx] || ex.reps;
}

async function loadCardio(dateStr) {
  cardioEntry = { minutes: "", done: false, notes: "", rowId: null };
  if (!sb) return;
  let data, error;
  try {
    ({ data, error } = await sb.from("cardio").select("*").eq("date", dateStr).maybeSingle());
  } catch (e) {
    error = e;
  }
  if (error) { console.error(error); return; }
  if (data) {
    cardioEntry = { minutes: data.minutes ?? "", done: !!data.done, notes: data.notes ?? "", rowId: data.id };
  }
}

function setStatus(state, msg) {
  const el = document.getElementById("statusLine");
  if (!el) return;
  el.className = "status-line " + state;
  if (state === "saving") el.textContent = "Saving…";
  else if (state === "saved") el.textContent = "✓ Saved";
  else if (state === "error") el.innerHTML = `⚠ ${msg || "Save failed"} <button onclick="retrySave()">Retry</button>`;
  else el.textContent = "";
}

let lastSaveArgs = null;
function retrySave() { if (lastSaveArgs) writeSet(...lastSaveArgs); }

async function writeSet(exIdx, setIdx, ex) {
  lastSaveArgs = [exIdx, setIdx, ex];
  if (!sb) { setStatus("error", "not configured"); return; }
  const key = `${exIdx}-${setIdx}`;
  const v = currentLog[key] || {};
  setStatus("saving");
  const row = {
    date: currentDate,
    workout: currentWorkoutId,
    exercise: ex.name,
    set_number: setIdx + 1,
    target_reps: effectiveReps(exIdx, ex),
    rir: ex.rir,
    weight: v.weight === "" || v.weight == null ? null : Number(v.weight),
    actual_reps: v.reps === "" || v.reps == null ? null : Number(v.reps),
    done: !!v.done,
    weight_per_side: !!exercisePerSide[exIdx],
  };
  if (setIdx === 0) row.notes = exerciseNotes[exIdx] || null; // notes live on set 1's row only
  let data, error;
  try {
    ({ data, error } = await sb.from("logs")
      .upsert(row, { onConflict: "date,workout,exercise,set_number" })
      .select()
      .single());
  } catch (e) {
    error = e;
  }
  if (error) { setStatus("error", error.message || "network error — tap to retry"); return; }
  currentLog[key] = { ...v, rowId: data.id, perSide: !!exercisePerSide[exIdx] };
  setStatus("saved");
  refreshProgressUI(); // update counts/checkmarks in place — never touch inputs while typing
}

function queueNoteSave(exIdx, ex) {
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(() => writeSet(exIdx, 0, ex), 400);
}

let editingReps = new Set(); // exIdx currently showing the inline reps-override editor

function startEditReps(exIdx) {
  editingReps.add(exIdx);
  renderTrain();
}

function cancelEditReps(exIdx) {
  editingReps.delete(exIdx);
  renderTrain();
}

function confirmEditReps(exIdx, ex) {
  const input = document.getElementById(`repsEditInput-${exIdx}`);
  const next = (input ? input.value : "").trim();
  targetOverride[exIdx] = next || ex.reps;
  editingReps.delete(exIdx);
  // re-persist target on any sets already logged this session
  const setCount = ex.sets + (extraSets[exIdx] || 0);
  for (let s = 0; s < setCount; s++) {
    if (currentLog[`${exIdx}-${s}`]) writeSet(exIdx, s, ex);
  }
  renderTrain();
}

function refreshProgressUI() {
  const w = workoutById(currentWorkoutId);
  let totalSets = 0, doneSets = 0;
  w.exercises.forEach((ex, ei) => {
    const setCount = ex.sets + (extraSets[ei] || 0);
    for (let s = 0; s < setCount; s++) {
      totalSets++;
      const isDone = !!currentLog[`${ei}-${s}`]?.done;
      if (isDone) doneSets++;
      const dot = document.querySelector(`.set-progress > div[data-dot="${ei}-${s}"]`);
      if (dot) dot.classList.toggle("done", isDone);
      const checkBtn = document.querySelector(`button[data-ex="${ei}"][data-set="${s}"][data-field="done"]`);
      if (checkBtn) checkBtn.innerHTML = chalkCheckSVG(isDone);
    }
  });
  const fill = document.getElementById("progressFill");
  const count = document.getElementById("progressCount");
  if (fill) fill.style.width = (totalSets ? (doneSets / totalSets * 100) : 0) + "%";
  if (count) count.textContent = `${doneSets}/${totalSets} sets`;
}

function queueSave(exIdx, setIdx, ex) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => writeSet(exIdx, setIdx, ex), 350);
}

function togglePerSide(exIdx) {
  exercisePerSide[exIdx] = !exercisePerSide[exIdx];
  renderTrain();
}

function addExtraSet(exIdx) {
  extraSets[exIdx] = (extraSets[exIdx] || 0) + 1;
  renderTrain();
}

async function writeCardio() {
  if (!sb) { setCardioStatus("error", "not configured"); return; }
  setCardioStatus("saving");
  const row = {
    date: currentDate,
    minutes: cardioEntry.minutes === "" || cardioEntry.minutes == null ? null : Number(cardioEntry.minutes),
    done: !!cardioEntry.done,
    notes: cardioEntry.notes || null,
  };
  let data, error;
  try {
    ({ data, error } = await sb.from("cardio")
      .upsert(row, { onConflict: "date" })
      .select()
      .single());
  } catch (e) {
    error = e;
  }
  if (error) { setCardioStatus("error", error.message || "network error — tap to retry"); return; }
  cardioEntry.rowId = data.id;
  setCardioStatus("saved");
}

function queueCardioSave() {
  clearTimeout(cardioSaveTimer);
  cardioSaveTimer = setTimeout(writeCardio, 350);
}

function setCardioStatus(state, msg) {
  const el = document.getElementById("cardioStatusLine");
  if (!el) return;
  el.className = "status-line " + state;
  if (state === "saving") el.textContent = "Saving…";
  else if (state === "saved") el.textContent = "✓ Saved";
  else if (state === "error") el.innerHTML = `⚠ ${msg || "Save failed"} <button onclick="writeCardio()">Retry</button>`;
  else el.textContent = "";
}

function wireManagePanel(w) {

function renderTrain() {
  const w = workoutById(currentWorkoutId);
  const el = document.getElementById("trainTab");

  const workoutOptions = WORKOUTS.map(x => `<option value="${x.id}" ${x.id===currentWorkoutId?"selected":""}>${x.label}</option>`).join("");

  let totalSets = 0, doneSets = 0;
  w.exercises.forEach((ex, ei) => {
    const setCount = ex.sets + (extraSets[ei] || 0);
    for (let s = 0; s < setCount; s++) {
      totalSets++;
      if (currentLog[`${ei}-${s}`]?.done) doneSets++;
    }
  });

  let html = `
    <div class="field-row">
      <div class="field">
        <label>DATE</label>
        <input type="date" id="dateInput" value="${currentDate}" />
      </div>
      <div class="field">
        <label>WORKOUT</label>
        <select id="workoutSelect">${workoutOptions}</select>

    </div>

    <div class="day-focus mono">${w.focus}</div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:${totalSets ? (doneSets/totalSets*100) : 0}%"></div></div>
      <div class="progress-count mono" id="progressCount">${doneSets}/${totalSets} sets</div>

    <div class="cue-box">${w.cue}</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:4px">
      <button class="pill" id="manageToggle">${managingExercises ? "✕ Close" : "⚙ Manage exercises"}</button>
    </div>
    ${managingExercises ? renderManagePanel(w) : ""}
  `;

  if (!w.exercises.length && !managingExercises) {
    html += `<div class="empty-note">No exercises in this workout yet. Tap "⚙ Manage exercises" above to add some.</div>`;
  }

  w.exercises.forEach((ex, ei) => {
    const unitLabel = ex.unit === "sec" ? "sec" : "reps";
    const setCount = ex.sets + (extraSets[ei] || 0);
    const perSide = !!exercisePerSide[ei];
    const reps = effectiveReps(ei, ex);
    const overridden = reps !== ex.reps;
    const isEditing = editingReps.has(ei);
    html += `<div class="exercise-card">
      <div class="exercise-head">
        <div>
          <div class="exercise-name disp">${escapeHtml(ex.name)}</div>
          <div class="exercise-target mono" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <span>${ex.sets} ×</span>
            ${isEditing

                 <button class="pill" style="padding:2px 8px;border-color:var(--green);color:var(--green)" data-save-reps="${ei}">✓</button>
                 <button class="pill" style="padding:2px 8px" data-cancel-reps="${ei}">✕</button>`

            ${ex.rir !== "—" ? `<span>·  RIR ${escapeHtml(ex.rir)}</span>` : ""}${ex.weightLabel ? `<span>·  ${escapeHtml(ex.weightLabel)} wt</span>` : ""}

      </div>

      <div>`;

      const v = currentLog[`${ei}-${s}`] || { weight: "", reps: "", done: false };
      html += `<div class="set-row">

    html += `</div>

      <div class="field-row" style="margin-top:8px">
        <div class="field">

        </div>

        </div>
      </div>
      <div class="field">
        <label>NOTES (optional)</label>
        <input type="text" id="cardioNotes" placeholder="incline treadmill, bike, etc." value="${escapeHtml(cardioEntry.notes ?? '')}"
          style="width:100%;font-family:ui-monospace,monospace;background:var(--bg-soft);border:1px solid var(--border);border-radius:6px;color:var(--chalk);font-size:13px;padding:8px 10px;outline:none;" />
      </div>
    </div>

  el.innerHTML = html;

  document.getElementById("dateInput").onchange = async (e) => {
    currentDate = e.target.value;
    await loadSession(currentDate, currentWorkoutId);

  document.getElementById("workoutSelect").onchange = async (e) => {

  el.querySelectorAll("input[data-field]").forEach(inp => {
    inp.addEventListener("input", (e) => {
      const ei = +e.target.dataset.ex, s = +e.target.dataset.set, field = e.target.dataset.field;

  });
  el.querySelectorAll("button[data-field='done']").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const t = e.currentTarget;
      const ei = +t.dataset.ex, s = +t.dataset.set;
      const key = `${ei}-${s}`;
      const cur = currentLog[key] || {};
      currentLog[key] = { ...cur, done: !cur.done };
      t.innerHTML = chalkCheckSVG(currentLog[key].done); // instant feedback, no re-render
      writeSet(ei, s, w.exercises[ei]);
    });
  });
  el.querySelectorAll("button[data-perside-ex]").forEach(btn => {
    btn.addEventListener("click", (e) => togglePerSide(+e.currentTarget.dataset.persideEx));
  });
  el.querySelectorAll("button[data-addset-ex]").forEach(btn => {
    btn.addEventListener("click", (e) => addExtraSet(+e.currentTarget.dataset.addsetEx));
  });
  el.querySelectorAll("button[data-override-ex]").forEach(btn => {
    btn.addEventListener("click", (e) => startEditReps(+e.currentTarget.dataset.overrideEx));
  });
  el.querySelectorAll("button[data-save-reps]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const ei = +e.currentTarget.dataset.saveReps;
      confirmEditReps(ei, w.exercises[ei]);
    });
  });
  el.querySelectorAll("button[data-cancel-reps]").forEach(btn => {
    btn.addEventListener("click", (e) => cancelEditReps(+e.currentTarget.dataset.cancelReps));
  });
  el.querySelectorAll("input[id^='repsEditInput-']").forEach(inp => {
    inp.addEventListener("keydown", (e) => {
      const ei = +inp.id.replace("repsEditInput-", "");
      if (e.key === "Enter") confirmEditReps(ei, w.exercises[ei]);
      if (e.key === "Escape") cancelEditReps(ei);
    });
  });
  el.querySelectorAll("input[data-note-ex]").forEach(inp => {
    inp.addEventListener("input", (e) => {
      const ei = +e.target.dataset.noteEx;
      exerciseNotes[ei] = e.target.value;
      queueNoteSave(ei, w.exercises[ei]);
    });
  });

  document.getElementById("cardioMinutes").addEventListener("input", (e) => {
    cardioEntry.minutes = e.target.value;
    queueCardioSave();
  });
  document.getElementById("cardioNotes").addEventListener("input", (e) => {
    cardioEntry.notes = e.target.value;
    queueCardioSave();
  });
  document.getElementById("cardioDoneBtn").addEventListener("click", () => {
    cardioEntry.done = !cardioEntry.done;
    writeCardio();
    renderTrain();
  });

  wireManagePanel(w);
}

/* ============================================================
   PROGRESS TAB
   ============================================================ */
function normalizedWeight(row) {
  // per-side weight represents half the true load on the body — normalize
  // to a total-equivalent so "best set" comparisons across a toggle stay fair
  if (row.weight == null) return null;
  return row.weight_per_side ? Number(row.weight) * 2 : Number(row.weight);
}

function bestSetLabel(entries) {
  if (!entries.length) return null;
  let best = entries.find(e => e.weight != null);
  entries.forEach(e => {
    if (e.weight != null && best && normalizedWeight(e) > normalizedWeight(best)) best = e;
  });
  if (!best) best = entries[0];
  const side = best.weight_per_side ? "/side" : "";
  const w = best.weight != null ? `${best.weight}${unit}${side}` : "BW";
  const r = best.actual_reps != null ? ` × ${best.actual_reps}` : "";
  return `${w}${r}`;
}

function fmtWeight(row) {
  return `${row.weight}${unit}${row.weight_per_side ? "/side" : ""}`;
}

// Shows how weight moved across the sets actually logged that session —
// e.g. "20lb → 30lb" for a ramp-up, not just one representative number.
function setRangeLabel(entries) {
  if (!entries.length) return null;
  const weighted = entries.filter(e => e.weight != null).sort((a, b) => a.set_number - b.set_number);
  if (!weighted.length) {
    // bodyweight-only exercise — fall back to a reps range across sets
    const repsOnly = entries.filter(e => e.actual_reps != null).sort((a, b) => a.set_number - b.set_number);
    if (!repsOnly.length) return null;
    const first = repsOnly[0], last = repsOnly[repsOnly.length - 1];
    return repsOnly.length > 1 && first.actual_reps !== last.actual_reps
      ? `${first.actual_reps} → ${last.actual_reps} reps`
      : `${last.actual_reps} reps`;
  }
  const first = weighted[0], last = weighted[weighted.length - 1];
  const lastReps = last.actual_reps != null ? ` × ${last.actual_reps}` : "";
  if (weighted.length === 1 || normalizedWeight(first) === normalizedWeight(last)) {
    return `${fmtWeight(last)}${lastReps}`;
  }
  return `${fmtWeight(first)} → ${fmtWeight(last)}${lastReps}`;
}

function jumpToEditDay(dateStr, workoutId) {
  currentDate = dateStr;
  currentWorkoutId = workoutId;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelector('.tab-btn[data-tab="train"]').classList.add("active");
  document.getElementById("trainTab").style.display = "block";
  document.getElementById("progressTab").style.display = "none";
  document.getElementById("notesTab").style.display = "none";
  document.getElementById("guideTab").style.display = "none";
  loadSession(currentDate, currentWorkoutId).then(renderTrain);
}

function weekRange(offset) {
  const today = new Date();
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7) + offset * 7); // Monday of target week
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return { start: localDateStr(monday), end: localDateStr(sunday), monday, sunday };
}

function svgLineChart(points, unitLabel) {
  // points: [{x: index, label: dateStr, y: weight}], simple hand-drawn SVG, no dependency
  if (points.length < 2) {
    return `<div class="empty-note">Need at least 2 logged sessions to draw a trend line.</div>`;
  }
  const W = 400, H = 160, padL = 34, padR = 12, padT = 14, padB = 24;
  const ys = points.map(p => p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanY = maxY - minY || 1;
  const xStep = (W - padL - padR) / (points.length - 1);
  const coords = points.map((p, i) => ({
    x: padL + i * xStep,
    y: padT + (H - padT - padB) * (1 - (p.y - minY) / spanY),
    ...p
  }));
  const path = coords.map((c, i) => `${i === 0 ? "M" : "L"}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(" ");
  const dots = coords.map(c => `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="var(--accent)" />`).join("");
  const labelEvery = Math.ceil(coords.length / 5);
  const xLabels = coords.filter((_, i) => i % labelEvery === 0 || i === coords.length - 1)
    .map(c => `<text x="${c.x.toFixed(1)}" y="${H-6}" font-size="9" fill="var(--chalk-faint)" text-anchor="middle" font-family="ui-monospace,monospace">${new Date(c.label+"T00:00:00").toLocaleDateString(undefined,{month:'numeric',day:'numeric'})}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <text x="4" y="${padT+4}" font-size="9" fill="var(--chalk-faint)" font-family="ui-monospace,monospace">${maxY}${unitLabel}</text>
    <text x="4" y="${H-padB}" font-size="9" fill="var(--chalk-faint)" font-family="ui-monospace,monospace">${minY}${unitLabel}</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" />
    ${dots}
    ${xLabels}
  </svg>`;
}

async function renderProgress() {
  const el = document.getElementById("progressTab");
  const pills = `<button class="pill ${progressView==='week'?'active':''}" data-id="week">📅 This Week</button>`
    + `<button class="pill ${progressView==='trend'?'active':''}" data-id="trend">📈 By Exercise</button>`
    + WORKOUTS.map(w => `<button class="pill ${w.id===progressView?'active':''}" data-id="${w.id}">${w.label.split("·")[0].trim()}</button>`).join("")
    + `<button class="pill ${progressView==='cardio'?'active':''}" data-id="cardio">🏃 Cardio</button>`;
  el.innerHTML = `<div class="pill-row">${pills}</div><div id="progressList" class="loading-note">Loading…</div>`;

  el.querySelectorAll(".pill[data-id]").forEach(p => {
    p.onclick = () => { progressView = p.dataset.id; renderProgress(); };
  });

  if (!sb) {
    document.getElementById("progressList").innerHTML = `<div class="empty-note">Not connected — configure Supabase in index.html.</div>`;
    return;
  }

  if (progressView === "week") { await renderWeekView(); return; }
  if (progressView === "trend") { await renderTrendView(); return; }

  if (progressView === "cardio") {
    const { data, error } = await sb.from("cardio").select("*").order("date", { ascending: false });
    const listEl = document.getElementById("progressList");
    if (error) { listEl.innerHTML = `<div class="empty-note">⚠ ${error.message}</div>`; return; }
    if (!data || !data.length) { listEl.innerHTML = `<div class="empty-note">No cardio logged yet.</div>`; return; }
    let html = "";
    data.forEach(row => {
      const dObj = new Date(row.date + "T00:00:00");
      html += `<div class="session-card">
        <div class="session-head">
          <div class="session-date disp">${dObj.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div>
          <div class="session-count mono">${row.done ? "✓ done" : "not marked done"}</div>
        </div>
        <div class="session-ex-row"><span>${row.minutes != null ? row.minutes + " min" : "no duration logged"}</span><span>${escapeHtml(row.notes || "")}</span></div>
      </div>`;
    });
    listEl.outerHTML = `<div id="progressList">${html}</div>`;
    return;
  }

  progressWorkoutId = progressView;
  const w = workoutById(progressWorkoutId);
  const { data, error } = await sb.from("logs")
    .select("*")
    .eq("workout", progressWorkoutId)
    .order("date", { ascending: false });

  const listEl = document.getElementById("progressList");
  if (error) { listEl.innerHTML = `<div class="empty-note">⚠ ${error.message}</div>`; return; }
  if (!data || !data.length) { listEl.innerHTML = `<div class="empty-note">No logged sessions yet for ${w.title} — ${w.focus}.</div>`; return; }

  // pull cardio for just the dates this workout was logged, so a lifting day
  // that also had cardio shows both in one card
  const dateList = [...new Set(data.map(r => r.date))];
  const { data: cardioRows } = await sb.from("cardio").select("*").in("date", dateList);
  const cardioByDate = {};
  (cardioRows || []).forEach(r => { cardioByDate[r.date] = r; });

  const byDate = {};
  data.forEach(row => { (byDate[row.date] = byDate[row.date] || []).push(row); });
  const dates = Object.keys(byDate).sort().reverse();

  let html = "";
  dates.forEach(dateStr => {
    const rows = byDate[dateStr];
    const doneCount = rows.filter(r => r.done).length;
    let totalSets = 0;
    w.exercises.forEach(ex => totalSets += ex.sets);
    const dObj = new Date(dateStr + "T00:00:00");
    html += `<div class="session-card">
      <div class="session-head">
        <div class="session-date disp">${dObj.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="session-count mono">${doneCount}/${totalSets}+ sets</div>
          <button class="pill" style="padding:3px 8px" data-edit-date="${dateStr}" data-edit-workout="${progressWorkoutId}">✎ Edit</button>
        </div>
      </div>`;
    if (cardioByDate[dateStr]) {
      const c = cardioByDate[dateStr];
      html += `<div class="session-ex-row" style="color:var(--gold)"><span>🏃 Cardio</span><span>${c.minutes != null ? c.minutes + " min" : ""}${c.done ? " ✓" : ""}</span></div>`;
    }
    w.exercises.forEach(ex => {
      const entries = rows.filter(r => r.exercise === ex.name && (r.weight != null || r.actual_reps != null));
      const label = setRangeLabel(entries);
      if (!label) return;
      html += `<div class="session-ex-row"><span>${escapeHtml(ex.name)}</span><span>${escapeHtml(label)}</span></div>`;
    });
    // catch anything logged under a name no longer in the current catalog —
    // e.g. an exercise since renamed or removed. The data is never gone;
    // this just makes sure it's still visible here.
    const catalogNames = new Set(w.exercises.map(e => e.name));
    const loggedNames = [...new Set(rows.map(r => r.exercise))];
    loggedNames.filter(n => !catalogNames.has(n)).forEach(name => {
      const entries = rows.filter(r => r.exercise === name && (r.weight != null || r.actual_reps != null));
      const label = setRangeLabel(entries);
      if (!label) return;
      html += `<div class="session-ex-row" style="color:var(--chalk-faint)"><span>${escapeHtml(name)} <span class="mono" style="font-size:10px">(no longer in catalog)</span></span><span>${escapeHtml(label)}</span></div>`;
    });
    if (rows.some(r => r.notes)) {
      const note = rows.find(r => r.notes)?.notes;
      html += `<div style="color:var(--chalk-faint);font-size:12px;margin-top:6px;font-style:italic">"${escapeHtml(note)}"</div>`;
    }
    html += `</div>`;
  });
  listEl.outerHTML = `<div id="progressList">${html}</div>`;
  document.querySelectorAll("button[data-edit-date]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      jumpToEditDay(e.currentTarget.dataset.editDate, e.currentTarget.dataset.editWorkout);
    });
  });
}

let expandedWeekRows = new Set(); // "date|workoutId" keys currently expanded in the Week view

async function renderWeekView() {
  const { start, end, monday, sunday } = weekRange(weekOffset);
  const listEl = document.getElementById("progressList");
  const label = `${monday.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${sunday.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;

  const [{ data: logRows, error: logErr }, { data: cardioRows }] = await Promise.all([
    sb.from("logs").select("*").gte("date", start).lte("date", end),
    sb.from("cardio").select("*").gte("date", start).lte("date", end),
  ]);
  if (logErr) { listEl.innerHTML = `<div class="empty-note">⚠ ${escapeHtml(logErr.message)}</div>`; return; }

  let nav = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <button class="pill" id="weekPrev">← Prev</button>
    <div class="mono" style="font-size:13px;color:var(--chalk)">${label}${weekOffset===0 ? " (this week)" : ""}</div>
    <button class="pill" id="weekNext">Next →</button>
  </div>`;

  const byDate = {};
  (logRows || []).forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = { workouts: {} };
    if (!byDate[r.date].workouts[r.workout]) byDate[r.date].workouts[r.workout] = [];
    byDate[r.date].workouts[r.workout].push(r);
  });
  const cardioByDate = {};
  (cardioRows || []).forEach(r => { cardioByDate[r.date] = r; });

  const allDates = [...new Set([...Object.keys(byDate), ...Object.keys(cardioByDate)])].sort().reverse();

  if (!allDates.length) {
    listEl.innerHTML = nav + `<div class="empty-note">Nothing logged for this week yet.</div>`;
  } else {
    let html = nav;
    allDates.forEach(dateStr => {
      const dObj = new Date(dateStr + "T00:00:00");
      html += `<div class="session-card">
        <div class="session-head"><div class="session-date disp">${dObj.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</div></div>`;
      const dayData = byDate[dateStr];
      if (dayData) {
        Object.entries(dayData.workouts).forEach(([workoutId, rows]) => {
          const w = workoutById(workoutId);
          const doneCount = rows.filter(r => r.done).length;
          const key = `${dateStr}|${workoutId}`;
          const isOpen = expandedWeekRows.has(key);
          const detailId = `weekDetail-${dateStr}-${workoutId}`;
          html += `<button class="session-ex-row" data-week-toggle="${key}" style="width:100%;background:none;border:none;text-align:left;cursor:pointer;padding:3px 0;font:inherit">
            <span style="display:flex;align-items:center;gap:5px"><span class="chev ${isOpen?'open':''}" style="font-size:10px">▾</span>${escapeHtml(w ? w.title.replace("— ","") : workoutId)}</span>
            <span>${doneCount} sets logged</span>
          </button>`;
          html += `<div id="${detailId}" style="display:${isOpen ? 'block' : 'none'};padding:2px 0 6px 15px">`;
          if (w) {
            w.exercises.forEach(ex => {
              const entries = rows.filter(r => r.exercise === ex.name && (r.weight != null || r.actual_reps != null));
              const rangeLabel = setRangeLabel(entries);
              if (!rangeLabel) return;
              html += `<div class="session-ex-row" style="font-size:12px"><span>${escapeHtml(ex.name)}</span><span>${escapeHtml(rangeLabel)}</span></div>`;
            });
            // same fallback as the by-workout Progress view: surface anything
            // logged under a name no longer in the current catalog
            const catalogNames = new Set(w.exercises.map(e => e.name));
            const loggedNames = [...new Set(rows.map(r => r.exercise))];
            loggedNames.filter(n => !catalogNames.has(n)).forEach(name => {
              const entries = rows.filter(r => r.exercise === name && (r.weight != null || r.actual_reps != null));
              const rangeLabel = setRangeLabel(entries);
              if (!rangeLabel) return;
              html += `<div class="session-ex-row" style="font-size:12px;color:var(--chalk-faint)"><span>${escapeHtml(name)} <span class="mono" style="font-size:10px">(no longer in catalog)</span></span><span>${escapeHtml(rangeLabel)}</span></div>`;
            });
            const noteRow = rows.find(r => r.notes);
            if (noteRow) {
              html += `<div style="color:var(--chalk-faint);font-size:11.5px;margin:4px 0;font-style:italic">"${escapeHtml(noteRow.notes)}"</div>`;
            }
          }
          html += `<button class="pill" style="padding:3px 8px;margin-top:4px" data-edit-date="${dateStr}" data-edit-workout="${workoutId}">✎ Edit this day</button>`;
          html += `</div>`;
        });
      }
      if (cardioByDate[dateStr]) {
        const c = cardioByDate[dateStr];
        html += `<div class="session-ex-row" style="color:var(--gold)"><span>🏃 Cardio</span><span>${c.minutes != null ? c.minutes + " min" : ""}${c.done ? " ✓" : ""}</span></div>`;
        if (c.notes) html += `<div style="color:var(--chalk-faint);font-size:11.5px;margin:2px 0 4px;padding-left:15px;font-style:italic">"${escapeHtml(c.notes)}"</div>`;
      }
      html += `</div>`;
    });
    listEl.innerHTML = html;

    listEl.querySelectorAll("button[data-week-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.weekToggle;
        const [dateStr, workoutId] = key.split("|");
        const detail = document.getElementById(`weekDetail-${dateStr}-${workoutId}`);
        const chev = btn.querySelector(".chev");
        if (expandedWeekRows.has(key)) {
          expandedWeekRows.delete(key);
          if (detail) detail.style.display = "none";
          if (chev) chev.classList.remove("open");
        } else {
          expandedWeekRows.add(key);
          if (detail) detail.style.display = "block";
          if (chev) chev.classList.add("open");
        }
      });
    });
    listEl.querySelectorAll("button[data-edit-date]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        jumpToEditDay(e.currentTarget.dataset.editDate, e.currentTarget.dataset.editWorkout);
      });
    });
  }

  document.getElementById("weekPrev").onclick = () => { weekOffset--; renderProgress(); };
  document.getElementById("weekNext").onclick = () => { weekOffset++; renderProgress(); };
}

async function renderTrendView() {
  const listEl = document.getElementById("progressList");
  listEl.innerHTML = `<div class="loading-note">Loading…</div>`;
  const logged = await allExerciseNamesEverLogged(); // includes exercises since renamed/deleted from the catalog
  const names = [...new Set([...allExerciseNames(), ...logged])].sort();
  if (!trendExercise || !names.includes(trendExercise)) trendExercise = names[0];
  const options = names.map(n => `<option value="${escapeHtml(n)}" ${n===trendExercise?"selected":""}>${escapeHtml(n)}</option>`).join("");
  listEl.innerHTML = `
    <div class="field" style="margin-bottom:14px">
      <label>EXERCISE</label>
      <select id="trendSelect">${options}</select>
    </div>
    <div id="trendBody" class="loading-note">Loading…</div>
  `;
  document.getElementById("trendSelect").onchange = (e) => { trendExercise = e.target.value; renderTrendView(); };

  const { data, error } = await sb.from("logs")
    .select("*")
    .eq("exercise", trendExercise)
    .order("date", { ascending: true });
  const body = document.getElementById("trendBody");
  if (error) { body.innerHTML = `<div class="empty-note">⚠ ${error.message}</div>`; return; }

  const byDate = {};
  (data || []).forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  const dates = Object.keys(byDate).sort();
  if (!dates.length) { body.innerHTML = `<div class="empty-note">No sessions logged yet for ${trendExercise}.</div>`; return; }

  const points = [];
  dates.forEach(dateStr => {
    const entries = byDate[dateStr].filter(r => r.weight != null);
    if (!entries.length) return;
    let best = entries[0];
    entries.forEach(e => { if (normalizedWeight(e) > normalizedWeight(best)) best = e; });
    points.push({ x: points.length, label: dateStr, y: normalizedWeight(best), reps: best.actual_reps, perSide: best.weight_per_side });
  });

  let html = points.length >= 2 ? svgLineChart(points, unit) : `<div class="empty-note">Need at least 2 logged weights to draw a trend line — here's what's logged so far:</div>`;
  if (points.some(p => p.perSide)) {
    html += `<div class="mono" style="font-size:10.5px;color:var(--chalk-faint);margin:-6px 0 10px">Chart shows total-equivalent load (per-side sets counted ×2) so it stays comparable.</div>`;
  }
  html += `<div style="margin-top:14px">`;
  [...dates].reverse().forEach(dateStr => {
    const entries = byDate[dateStr];
    const label = bestSetLabel(entries.filter(r => r.weight != null || r.actual_reps != null));
    if (!label) return;
    const dObj = new Date(dateStr + "T00:00:00");
    html += `<div class="session-ex-row"><span>${dObj.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><span>${label}</span></div>`;
  });
  html += `</div>`;
  body.innerHTML = html;
}

      </div>
      <div class="session-ex-row" style="color:var(--chalk)"><b>${escapeHtml(row.exercise)}</b></div>
      <div style="color:var(--chalk-dim);font-size:13px;margin-top:4px;line-height:1.5">${escapeHtml(row.notes)}</div>
    </div>`;
  });
  el.innerHTML = html;
}

function renderGuide() {
  const el = document.getElementById("guideTab");
  el.innerHTML = GUIDE_SECTIONS.map((s, i) => `
    <div class="section">
      <button class="section-btn" data-i="${i}">
        <div class="left"><span class="section-title disp">${s.title}</span></div>
        <span class="chev ${s.open ? 'open' : ''}">▾</span>
      </button>
      <div class="section-body" style="display:${s.open ? 'block' : 'none'}">${s.html}</div>
    </div>`).join("");
  el.querySelectorAll(".section-btn").forEach(btn => {
    btn.onclick = () => {
      const body = btn.parentElement.querySelector(".section-body");
      const chev = btn.querySelector(".chev");
      const isOpen = body.style.display === "block";
      body.style.display = isOpen ? "none" : "block";
      chev.classList.toggle("open", !isOpen);
    };
  });
}

/* ============================================================
   TABS + INIT
   ============================================================ */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("trainTab").style.display = tab === "train" ? "block" : "none";
    document.getElementById("progressTab").style.display = tab === "progress" ? "block" : "none";
    document.getElementById("notesTab").style.display = tab === "notes" ? "block" : "none";
    document.getElementById("guideTab").style.display = tab === "guide" ? "block" : "none";
    if (tab === "progress") renderProgress();
    if (tab === "notes") renderNotes();
  });
});

document.getElementById("unitBtn").textContent = unit.toUpperCase();
document.getElementById("unitBtn").onclick = () => {
  unit = unit === "lb" ? "kg" : "lb";
  localStorage.setItem("ivneet_unit_pref", unit);
  document.getElementById("unitBtn").textContent = unit.toUpperCase();
};

function setBackupStatus(state, msg) {
  const el = document.getElementById("backupStatus");
  if (!el) return;
  el.className = "status-line " + state;
  if (state === "saving") el.textContent = "Preparing backup…";
  else if (state === "saved") el.textContent = "✓ Downloaded — if nothing appeared, use \"View as text\" below";
  else if (state === "error") el.innerHTML = `⚠ ${escapeHtml(msg || "backup failed")} <button onclick="exportBackup()">Retry</button>`;
  else el.textContent = "";
}

let backupInProgress = false; // prevents a double-tap from firing two exports at once
let lastBackupJson = null; // kept in memory so "View as text" never needs to re-fetch

async function exportBackup() {
  if (!sb || backupInProgress) return;
  backupInProgress = true;
  setBackupStatus("saving");
  document.getElementById("backupTextArea")?.remove();
  try {
    const [logsRes, cardioRes, exercisesRes] = await Promise.all([
      sb.from("logs").select("*"),
      sb.from("cardio").select("*"),
      sb.from("exercises").select("*"),
    ]);
    if (logsRes.error) throw logsRes.error;
    if (cardioRes.error) throw cardioRes.error;
    if (exercisesRes.error) throw exercisesRes.error;
    const bundle = {
      exported_at: new Date().toISOString(),
      logs: logsRes.data || [],
      cardio: cardioRes.data || [],
      exercises: exercisesRes.data || [],
    };
    const json = JSON.stringify(bundle, null, 2);
    lastBackupJson = json;

    // Primary path: trigger a normal file download. Works reliably on
    // desktop and Android Chrome.
    try {
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ivneet-strength-backup-${localDateStr(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      console.error("download trigger failed, text fallback still available:", e);
    }

    setBackupStatus("saved");
    showBackupTextFallback(json);
  } catch (e) {
    setBackupStatus("error", e.message || "network error — tap to retry");
  } finally {
    backupInProgress = false;
  }
}

function showBackupTextFallback(json) {
  const container = document.getElementById("backupStatus");
  if (!container) return;
  const wrap = document.createElement("div");
  wrap.id = "backupTextArea";
  wrap.style.textAlign = "left";
  wrap.style.marginTop = "6px";
  wrap.innerHTML = `
    <button class="pill" id="backupToggleText" style="font-size:11px;padding:4px 8px">View as text (fallback if the download didn't appear)</button>
    <div id="backupTextBody" style="display:none;margin-top:6px">
      <textarea readonly style="width:100%;height:90px;font-family:ui-monospace,monospace;font-size:10px;background:var(--bg-soft);border:1px solid var(--border);border-radius:5px;color:var(--chalk-dim);padding:8px;box-sizing:border-box;">${escapeHtml(json)}</textarea>
      <button class="pill" id="backupCopyBtn" style="margin-top:6px;font-size:11px;padding:4px 8px">Copy to clipboard</button>
      <span id="backupCopyMsg" class="mono" style="font-size:10.5px;color:var(--chalk-faint);margin-left:6px"></span>
    </div>
  `;
  container.appendChild(wrap);
  document.getElementById("backupToggleText").onclick = () => {
    const body = document.getElementById("backupTextBody");
    body.style.display = body.style.display === "none" ? "block" : "none";
  };
  document.getElementById("backupCopyBtn").onclick = async () => {
    const msgEl = document.getElementById("backupCopyMsg");
    try {
      await navigator.clipboard.writeText(json);
      msgEl.textContent = "Copied";
    } catch (e) {
      msgEl.textContent = "Select the text above and copy manually";
    }
    setTimeout(() => { if (msgEl) msgEl.textContent = ""; }, 3000);
  };
}

document.getElementById("backupBtn").onclick = exportBackup;

document.getElementById("todayLabel").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
document.getElementById("trainTab").innerHTML = `<div class="loading-note">Loading program…</div>`;

(async function init() {
  await checkConnection();
  await loadExercises();
  if (exercisesLoadFailed) {
    const banner = document.getElementById("banner");
    banner.className = "banner fail";
    banner.textContent = "⚠ Exercise catalog not found — run the migration SQL from SETUP.md before using the app (your logged history is safe and untouched).";
    document.getElementById("trainTab").innerHTML = `<div class="empty-note">Waiting on the one-time database setup — see the banner above. Nothing has been deleted.</div>`;
    return;
  }
  await loadSession(currentDate, currentWorkoutId);
  renderTrain();
  renderGuide();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
