    border-radius: 6px; color: var(--chalk); font-size: 14px; padding: 9px 10px; outline: none;

/* ============================================================

async function checkConnection() {
  const banner = document.getElementById("banner");
  if (!sb) {
    banner.className = "banner fail";
    banner.textContent = "⚠ Not configured — paste your Supabase URL & key into index.html (see SETUP.md).";
    return false;
  }
  try {
    const { error } = await sb.from("logs").select("id").limit(1);
    if (error) throw error;
    banner.className = "banner ok";
    banner.textContent = "✓ Connected — entries save automatically";
    return true;
  } catch (e) {
    banner.className = "banner fail";
    banner.textContent = "⚠ Storage error: " + (e.message || "could not reach database");
    return false;
  }
}

/* ============================================================
   TRAIN TAB
   ============================================================ */
async function loadSession(dateStr, workoutId) {
  currentLog = {};
  exercisePerSide = {};
  extraSets = {};
  if (!sb) return;
  const { data, error } = await sb.from("logs")
    .select("*")
    .eq("date", dateStr)
    .eq("workout", workoutId);
  if (error) { console.error(error); return; }
  const w = workoutById(workoutId);
  const maxSetSeen = {};
  (data || []).forEach(row => {
    const exIdx = w.exercises.findIndex(e => e.name === row.exercise);
    if (exIdx === -1) return;
    currentLog[`${exIdx}-${row.set_number - 1}`] = {
      weight: row.weight ?? "", reps: row.actual_reps ?? "", done: !!row.done,
      rowId: row.id, perSide: !!row.weight_per_side
    };
    if (row.weight_per_side) exercisePerSide[exIdx] = true;
    maxSetSeen[exIdx] = Math.max(maxSetSeen[exIdx] || 0, row.set_number);
  });
  w.exercises.forEach((ex, ei) => {
    const seen = maxSetSeen[ei] || 0;
    if (seen > ex.sets) extraSets[ei] = seen - ex.sets;
  });
  await loadCardio(dateStr);
}

async function loadCardio(dateStr) {
  cardioEntry = { minutes: "", done: false, notes: "", rowId: null };
  if (!sb) return;
  const { data, error } = await sb.from("cardio").select("*").eq("date", dateStr).maybeSingle();
  if (error) { console.error(error); return; }
  if (data) {
    cardioEntry = { minutes: data.minutes ?? "", done: !!data.done, notes: data.notes ?? "", rowId: data.id };
  }
}

function setStatus(state, msg) {
  const el = document.getElementById("statusLine");
  if (!el) return;
  el.className = "status-line " + state;
  if (state === "saving") el.textContent = "Saving…";
  else if (state === "saved") el.textContent = "✓ Saved";
  else if (state === "error") el.innerHTML = `⚠ ${msg || "Save failed"} <button onclick="retrySave()">Retry</button>`;
  else el.textContent = "";
}

let lastSaveArgs = null;
function retrySave() { if (lastSaveArgs) writeSet(...lastSaveArgs); }

async function writeSet(exIdx, setIdx, ex) {
  lastSaveArgs = [exIdx, setIdx, ex];
  if (!sb) { setStatus("error", "not configured"); return; }
  const key = `${exIdx}-${setIdx}`;
  const v = currentLog[key] || {};

  const row = {
    date: currentDate,
    workout: currentWorkoutId,
    exercise: ex.name,
    set_number: setIdx + 1,
    target_reps: ex.reps,
    rir: ex.rir,
    weight: v.weight === "" || v.weight == null ? null : Number(v.weight),
    actual_reps: v.reps === "" || v.reps == null ? null : Number(v.reps),
    done: !!v.done,
    weight_per_side: !!exercisePerSide[exIdx],
  };
  const { data, error } = await sb.from("logs")
    .upsert(row, { onConflict: "date,workout,exercise,set_number" })
    .select()
    .single();
  if (error) { setStatus("error", error.message); return; }
  currentLog[key] = { ...v, rowId: data.id, perSide: !!exercisePerSide[exIdx] };
  setStatus("saved");
  renderTrain(); // refresh progress bar
}

function queueSave(exIdx, setIdx, ex) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => writeSet(exIdx, setIdx, ex), 350);
}

function togglePerSide(exIdx) {
  exercisePerSide[exIdx] = !exercisePerSide[exIdx];
  renderTrain();
}

function addExtraSet(exIdx) {
  extraSets[exIdx] = (extraSets[exIdx] || 0) + 1;
  renderTrain();
}

let lastCardioSaveOk = true;
async function writeCardio() {
  if (!sb) { setCardioStatus("error", "not configured"); return; }
  setCardioStatus("saving");
  const row = {
    date: currentDate,
    minutes: cardioEntry.minutes === "" || cardioEntry.minutes == null ? null : Number(cardioEntry.minutes),
    done: !!cardioEntry.done,
    notes: cardioEntry.notes || null,
  };
  const { data, error } = await sb.from("cardio")
    .upsert(row, { onConflict: "date" })
    .select()
    .single();
  if (error) { setCardioStatus("error", error.message); return; }
  cardioEntry.rowId = data.id;
  setCardioStatus("saved");
}

function queueCardioSave() {
  clearTimeout(cardioSaveTimer);
  cardioSaveTimer = setTimeout(writeCardio, 350);
}

function setCardioStatus(state, msg) {
  const el = document.getElementById("cardioStatusLine");
  if (!el) return;
  el.className = "status-line " + state;
  if (state === "saving") el.textContent = "Saving…";
  else if (state === "saved") el.textContent = "✓ Saved";
  else if (state === "error") el.innerHTML = `⚠ ${msg || "Save failed"} <button onclick="writeCardio()">Retry</button>`;
  else el.textContent = "";
}

function renderTrain() {
  const w = workoutById(currentWorkoutId);
  const el = document.getElementById("trainTab");

  const workoutOptions = WORKOUTS.map(x => `<option value="${x.id}" ${x.id===currentWorkoutId?"selected":""}>${x.label}</option>`).join("");

  let totalSets = 0, doneSets = 0;
  w.exercises.forEach((ex, ei) => {
    const setCount = ex.sets + (extraSets[ei] || 0);
    for (let s = 0; s < setCount; s++) {
      totalSets++;
      if (currentLog[`${ei}-${s}`]?.done) doneSets++;
    }
  });

  let html = `
    <div class="field-row">
      <div class="field">
        <label>DATE</label>
        <input type="date" id="dateInput" value="${currentDate}" />
      </div>
      <div class="field">
        <label>WORKOUT</label>
        <select id="workoutSelect">${workoutOptions}</select>
      </div>
    </div>
    <div id="statusLine" class="status-line"></div>
    <div class="day-title disp">${w.title}</div>
    <div class="day-focus mono">${w.focus}</div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${totalSets ? (doneSets/totalSets*100) : 0}%"></div></div>
      <div class="progress-count mono">${doneSets}/${totalSets} sets</div>
    </div>
    <div class="cue-box">${w.cue}</div>
  `;

  w.exercises.forEach((ex, ei) => {
    const unitLabel = ex.unit === "sec" ? "sec" : "reps";
    const setCount = ex.sets + (extraSets[ei] || 0);
    const perSide = !!exercisePerSide[ei];
    html += `<div class="exercise-card">
      <div class="exercise-head">
        <div>
          <div class="exercise-name disp">${ex.name}</div>
          <div class="exercise-target mono">${ex.sets} × ${ex.reps}${ex.rir !== "—" ? `  ·  RIR ${ex.rir}` : ""}${ex.weightLabel ? `  ·  ${ex.weightLabel} wt` : ""}</div>
        </div>
        <a class="video-link mono" href="${ex.video}" target="_blank" rel="noopener noreferrer">▶ form</a>
      </div>
      ${ex.weight ? `<button class="pill" style="margin-top:8px" data-perside-ex="${ei}">${perSide ? "◐ Per side" : "◯ Total weight"}</button>` : ""}
      <div>`;
    for (let s = 0; s < setCount; s++) {
      const v = currentLog[`${ei}-${s}`] || { weight: "", reps: "", done: false };
      html += `<div class="set-row">
        <div class="set-idx">${s+1}</div>
        ${ex.weight
          ? `<input type="number" inputmode="decimal" placeholder="${ex.weightLabel === 'Assist' ? 'assist' : ''} ${perSide ? '/side' : 'total'}" value="${v.weight ?? ''}" data-ex="${ei}" data-set="${s}" data-field="weight" />`
          : `<div class="bw-label mono">bodyweight</div>`}
        <input type="number" inputmode="numeric" placeholder="${unitLabel}" value="${v.reps ?? ''}" data-ex="${ei}" data-set="${s}" data-field="reps" />
        <button class="chalk-check" data-ex="${ei}" data-set="${s}" data-field="done">${chalkCheckSVG(v.done)}</button>
      </div>`;
    }
    html += `</div>
      <div class="set-progress">`;
    for (let s = 0; s < setCount; s++) html += `<div class="${currentLog[`${ei}-${s}`]?.done ? 'done' : ''}"></div>`;
    html += `</div>
      <button class="pill" style="margin:2px 0 12px" data-addset-ex="${ei}">+ Add extra set</button>
      </div>`;
  });

  // cardio — independent of which workout is selected; tied only to the date
  html += `
    <div class="exercise-card">
      <div class="exercise-head">
        <div>
          <div class="exercise-name disp">Cardio / Conditioning</div>
          <div class="exercise-target mono">Logged per date, separate from lifting</div>
        </div>
      </div>
      <div id="cardioStatusLine" class="status-line"></div>
      <div class="field-row" style="margin-top:8px">
        <div class="field">
          <label>MINUTES</label>
          <input type="number" inputmode="numeric" id="cardioMinutes" placeholder="min" value="${cardioEntry.minutes ?? ''}" />
        </div>
        <div class="field" style="display:flex;align-items:flex-end;gap:8px;">
          <button class="chalk-check" id="cardioDoneBtn">${chalkCheckSVG(cardioEntry.done)}</button>
          <span class="mono" style="font-size:12px;color:var(--chalk-dim)">Done</span>
        </div>
      </div>
      <div class="field">
        <label>NOTES (optional)</label>
        <input type="text" id="cardioNotes" placeholder="incline treadmill, bike, etc." value="${cardioEntry.notes ?? ''}"
          style="width:100%;font-family:ui-monospace,monospace;background:var(--bg-soft);border:1px solid var(--border);border-radius:6px;color:var(--chalk);font-size:13px;padding:8px 10px;outline:none;" />
      </div>
    </div>
  `;

  el.innerHTML = html;

  document.getElementById("dateInput").onchange = async (e) => {
    currentDate = e.target.value;
    await loadSession(currentDate, currentWorkoutId);
    renderTrain();
  };
  document.getElementById("workoutSelect").onchange = async (e) => {
    currentWorkoutId = e.target.value;
    await loadSession(currentDate, currentWorkoutId);
    renderTrain();
  };
  el.querySelectorAll("input[data-field]").forEach(inp => {
    inp.addEventListener("input", (e) => {
      const ei = +e.target.dataset.ex, s = +e.target.dataset.set, field = e.target.dataset.field;
      const key = `${ei}-${s}`;
      currentLog[key] = { ...(currentLog[key] || {}), [field]: e.target.value };
      queueSave(ei, s, w.exercises[ei]);
    });
  });
  el.querySelectorAll("button[data-field='done']").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const t = e.currentTarget;
      const ei = +t.dataset.ex, s = +t.dataset.set;
      const key = `${ei}-${s}`;
      const cur = currentLog[key] || {};
      currentLog[key] = { ...cur, done: !cur.done };
      writeSet(ei, s, w.exercises[ei]);
    });
  });
  el.querySelectorAll("button[data-perside-ex]").forEach(btn => {
    btn.addEventListener("click", (e) => togglePerSide(+e.currentTarget.dataset.persideEx));
  });
  el.querySelectorAll("button[data-addset-ex]").forEach(btn => {
    btn.addEventListener("click", (e) => addExtraSet(+e.currentTarget.dataset.addsetEx));
  });

  document.getElementById("cardioMinutes").addEventListener("input", (e) => {
    cardioEntry.minutes = e.target.value;
    queueCardioSave();
  });
  document.getElementById("cardioNotes").addEventListener("input", (e) => {
    cardioEntry.notes = e.target.value;
    queueCardioSave();
  });
  document.getElementById("cardioDoneBtn").addEventListener("click", () => {
    cardioEntry.done = !cardioEntry.done;
    writeCardio();
    renderTrain();
  });
}

/* ============================================================
   PROGRESS TAB
   ============================================================ */
function bestSetLabel(entries) {
  if (!entries.length) return null;
  let best = entries.find(e => e.weight != null);
  entries.forEach(e => { if (e.weight != null && best && Number(e.weight) > Number(best.weight)) best = e; });
  if (!best) best = entries[0];
  const side = best.weight_per_side ? "/side" : "";
  const w = best.weight != null ? `${best.weight}${unit}${side}` : "BW";
  const r = best.actual_reps != null ? ` × ${best.actual_reps}` : "";
  return `${w}${r}`;
}

function jumpToEditDay(dateStr, workoutId) {
  currentDate = dateStr;
  currentWorkoutId = workoutId;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelector('.tab-btn[data-tab="train"]').classList.add("active");
  document.getElementById("trainTab").style.display = "block";
  document.getElementById("progressTab").style.display = "none";
  document.getElementById("guideTab").style.display = "none";
  loadSession(currentDate, currentWorkoutId).then(renderTrain);
}

async function renderProgress() {
  const el = document.getElementById("progressTab");
  const pills = WORKOUTS.map(w => `<button class="pill ${w.id===progressView?'active':''}" data-id="${w.id}">${w.label.split("·")[0].trim()}</button>`).join("")
    + `<button class="pill ${progressView==='cardio'?'active':''}" data-id="cardio">🏃 Cardio</button>`;
  el.innerHTML = `<div class="pill-row">${pills}</div><div id="progressList" class="loading-note">Loading…</div>`;

  el.querySelectorAll(".pill").forEach(p => {
    p.onclick = () => { progressView = p.dataset.id; renderProgress(); };
  });

  if (!sb) {
    document.getElementById("progressList").innerHTML = `<div class="empty-note">Not connected — configure Supabase in index.html.</div>`;
    return;
  }

  if (progressView === "cardio") {
    const { data, error } = await sb.from("cardio").select("*").order("date", { ascending: false });
    const listEl = document.getElementById("progressList");
    if (error) { listEl.innerHTML = `<div class="empty-note">⚠ ${error.message}</div>`; return; }
    if (!data || !data.length) { listEl.innerHTML = `<div class="empty-note">No cardio logged yet.</div>`; return; }
    let html = "";
    data.forEach(row => {
      const dObj = new Date(row.date + "T00:00:00");
      html += `<div class="session-card">
        <div class="session-head">
          <div class="session-date disp">${dObj.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div>
          <div class="session-count mono">${row.done ? "✓ done" : "not marked done"}</div>
        </div>
        <div class="session-ex-row"><span>${row.minutes != null ? row.minutes + " min" : "no duration logged"}</span><span>${row.notes || ""}</span></div>
      </div>`;
    });
    listEl.outerHTML = `<div id="progressList">${html}</div>`;
    return;
  }

  progressWorkoutId = progressView;
  const w = workoutById(progressWorkoutId);
  const { data, error } = await sb.from("logs")
    .select("*")
    .eq("workout", progressWorkoutId)
    .order("date", { ascending: false });

  const listEl = document.getElementById("progressList");
  if (error) { listEl.innerHTML = `<div class="empty-note">⚠ ${error.message}</div>`; return; }
  if (!data || !data.length) { listEl.innerHTML = `<div class="empty-note">No logged sessions yet for ${w.title} — ${w.focus}.</div>`; return; }

  // pull cardio for just the dates this workout was logged, so a lifting day
  // that also had cardio shows both in one card
  const dateList = [...new Set(data.map(r => r.date))];
  const { data: cardioRows } = await sb.from("cardio").select("*").in("date", dateList);
  const cardioByDate = {};
  (cardioRows || []).forEach(r => { cardioByDate[r.date] = r; });

  const byDate = {};
  data.forEach(row => { (byDate[row.date] = byDate[row.date] || []).push(row); });
  const dates = Object.keys(byDate).sort().reverse();

  let html = "";
  dates.forEach(dateStr => {
    const rows = byDate[dateStr];
    const doneCount = rows.filter(r => r.done).length;
    let totalSets = 0;
    w.exercises.forEach(ex => totalSets += ex.sets);
    const dObj = new Date(dateStr + "T00:00:00");
    html += `<div class="session-card">
      <div class="session-head">
        <div class="session-date disp">${dObj.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="session-count mono">${doneCount}/${totalSets}+ sets</div>
          <button class="pill" style="padding:3px 8px" data-edit-date="${dateStr}" data-edit-workout="${progressWorkoutId}">✎ Edit</button>
        </div>
      </div>`;
    if (cardioByDate[dateStr]) {
      const c = cardioByDate[dateStr];
      html += `<div class="session-ex-row" style="color:var(--gold)"><span>🏃 Cardio</span><span>${c.minutes != null ? c.minutes + " min" : ""}${c.done ? " ✓" : ""}</span></div>`;
    }
    w.exercises.forEach(ex => {
      const entries = rows.filter(r => r.exercise === ex.name && (r.weight != null || r.actual_reps != null));
      const label = bestSetLabel(entries);
      if (!label) return;
      html += `<div class="session-ex-row"><span>${ex.name}</span><span>${label}</span></div>`;
    });
    html += `</div>`;
  });
  listEl.outerHTML = `<div id="progressList">${html}</div>`;
  document.querySelectorAll("button[data-edit-date]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      jumpToEditDay(e.currentTarget.dataset.editDate, e.currentTarget.dataset.editWorkout);
    });
  });
}

   GUIDE TAB
   ============================================================ */
const GUIDE_SECTIONS = [
  { title: "Program Goals", open: true, html: `
    <ul style="margin:0;padding-left:18px">
      <li>Build lean muscle, with emphasis on lower-body development</li>
      <li>Achieve an unassisted pull-up</li>
      <li>Improve push-up strength, technique, and reps</li>
      <li>Increase upper-body pulling and pushing strength</li>
      <li>Improve core stability and grip strength</li>
      <li>Maintain mobility and movement quality</li>
    </ul>` },
  { title: "Training Guidelines", html: `
    <p><b>Intensity:</b> most working sets finish around RIR 1–3. Stop pull-up/push-up skill work before form breaks down.</p>
    <p><b>Rest:</b> 2–3 min compound lifts, 60–90 sec accessories, 90–180 sec pull-up skill work.</p>
    <p><b>Tempo:</b> control the eccentric for about 2–3 seconds unless noted.</p>
    <p><b>Overload:</b> improve quality and reps first — only add load once the top of the rep range is clean at the prescribed RIR.</p>
    <p style="color:var(--accent)">Sharp or increasing pain — especially right shoulder, wrist, or lower back — is never something to push through.</p>` },
  { title: "Pull-Up Progression", html: `
    <p><b>Weeks 1–2:</b> active hangs + scapular pull-ups + assisted pull-ups.</p>
    <p><b>Weeks 3–4:</b> gradually decrease assistance while reps stay clean. Add 3×3 slow negatives once a week if the shoulder tolerates it (~3–5 sec down).</p>
    <p><b>Weeks 5–6:</b> keep assisted reps + slower negatives, begin occasional unassisted attempts while fresh — not after exhausting the back.</p>
    <p style="color:var(--chalk-faint)">Milestones: 30-sec hang → 8–10 scapular pull-ups → 6–8 clean assisted reps → 5–10 sec controlled negative → less assistance → 1 unassisted rep.</p>` },
  { title: "Push-Up Progression", html: `
    <p>Start at an elevation allowing ~8–12 clean reps. Once 3×12 is clean, lower the surface and rebuild: 3×8 → 3×10 → 3×12 → lower again — toward floor push-ups.</p>
    <p><b>Technique:</b> body moves as one unit, core braced, elbows controlled, chest toward the surface, no collapsing through the hips.</p>
    <p style="color:var(--chalk-faint)">If wrist extension is uncomfortable, use push-up handles, dumbbells, or an elevated bar for a more neutral wrist.</p>` },
  { title: "Nutrition Foundation", html: `
    <p>The goal isn't just to get lighter — with this training volume, food supports lean muscle, performance, and recovery. Protein consistency comes first.</p>
    <p><b>Protein goal:</b> 80–100 g/day across ~3–4 meals — no need to hit it perfectly every day.</p>
    <p class="mono" style="font-size:12.5px">Breakfast 20–25g · Lunch 25–30g · Snack 15–20g · Dinner 25–30g</p>
    <p><b>Breakfast:</b> Greek yogurt + fruit + eggs · eggs + toast + fruit · yogurt + protein powder + berries</p>
    <p><b>Lunch:</b> don't skip it — chicken/turkey + rice + veg · wrap + fruit · tuna + potatoes/rice + salad · yogurt + fruit + shake when short on time</p>
    <p><b>Dinner:</b> grilled chicken/fish + rice or potatoes + vegetables</p>` },
  { title: "Hydration", html: `
    <p>Stay consistent through the day rather than catching up around training — water after waking, through the workday, around training, and with meals. Add more on hot days or high-sweat sessions.</p>` },
  { title: "Recovery", html: `
    <p>Six days a week makes recovery part of the program, not optional. If performance drops, soreness lingers, sleep suffers, or the shoulder/wrist/lower back gets more irritated, dial back volume. Not every workout needs to be maximal — hard days + moderate days + recovery = progress.</p>` },
  { title: "6–8 Week Targets", html: `
    <ul style="margin:0;padding-left:18px">
      <li><b>Pull-up:</b> less assistance, better scapular control and eccentric strength, progress toward the first unassisted rep</li>
      <li><b>Push-up:</b> more clean reps, progress toward a lower elevation/floor variation</li>
      <li><b>Lower body:</b> more strength and development via progressive resistance</li>
      <li><b>Body composition:</b> support lean muscle while improving composition</li>
      <li><b>Nutrition:</b> more protein consistency, fewer skipped meals</li>
      <li><b>Habits:</b> a challenging but sustainable six-day structure</li>
    </ul>` },
];

function renderGuide() {
  const el = document.getElementById("guideTab");
  el.innerHTML = GUIDE_SECTIONS.map((s, i) => `
    <div class="section">
      <button class="section-btn" data-i="${i}">
        <div class="left"><span class="section-title disp">${s.title}</span></div>
        <span class="chev ${s.open ? 'open' : ''}">▾</span>
      </button>
      <div class="section-body" style="display:${s.open ? 'block' : 'none'}">${s.html}</div>
    </div>`).join("");
  el.querySelectorAll(".section-btn").forEach(btn => {
    btn.onclick = () => {
      const body = btn.parentElement.querySelector(".section-body");
      const chev = btn.querySelector(".chev");
      const isOpen = body.style.display === "block";
      body.style.display = isOpen ? "none" : "block";
      chev.classList.toggle("open", !isOpen);
    };
  });
}

/* ============================================================
   TABS + INIT
   ============================================================ */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    document.getElementById("trainTab").style.display = tab === "train" ? "block" : "none";
    document.getElementById("progressTab").style.display = tab === "progress" ? "block" : "none";
    document.getElementById("guideTab").style.display = tab === "guide" ? "block" : "none";
    if (tab === "progress") renderProgress();
  });
});

document.getElementById("unitBtn").textContent = unit.toUpperCase();
document.getElementById("unitBtn").onclick = () => {
  unit = unit === "lb" ? "kg" : "lb";
  localStorage.setItem("ivneet_unit_pref", unit);
  document.getElementById("unitBtn").textContent = unit.toUpperCase();
};

document.getElementById("todayLabel").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });

(async function init() {
  await checkConnection();
  await loadSession(currentDate, currentWorkoutId);
  renderTrain();
  renderGuide();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
